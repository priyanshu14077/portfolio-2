<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art Preview</title>
    <style>
      body { margin: 0; background: #0b1020; color: #f4f8ff; font: 12px/1.3 ui-monospace, Menlo, monospace; }
      h2 { margin: 0; padding: 12px 16px 4px; font-size: 13px; }
      .panel { padding: 8px 16px 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
      .panel.cobalt { background: #1546c4; }
      .panel.dark { background: #0b1020; }
      figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      figcaption { font-size: 10px; opacity: 0.85; }
      canvas { image-rendering: pixelated; display: block; }
      #status { padding: 8px 16px; }
      #status.bad { background: #e5484d; }
    </style>
  </head>
  <body>
    <div id="status">checking…</div>
    <div id="root"></div>
    <script type="module" src="/src/art/preview.ts"></script>
  </body>
</html>
